name: Saffron
description: Saffron (trysaffron.ai) is a Y Combinator (Spring 2026) startup building
  an AI-native technical assessment platform for engineering hiring. Candidates build
  real features on a company's actual codebase using AI coding tools such as Claude
  Code inside a sandboxed environment, while Saffron captures every keystroke and AI
  interaction to score submissions against custom rubrics. It provides line-by-line
  attribution distinguishing human-written, AI-generated, and AI-modified code, and
  replaces traditional phone screens, take-homes, and on-site interview loops with
  a single AI-integrated assessment.
